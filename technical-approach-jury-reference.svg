<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">KrushiSetu technical approach reference showing Capture Decide Complete</title>
  <desc id="desc">A jury-oriented technical approach slide. It shows crop and market inputs feeding a net return engine, which leads to an executed and traceable sale.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.ink{fill:#13392c}.green{fill:#218447}.dark{fill:#12382b}.lime{fill:#d9f55a}.orange{fill:#e67d2e}.pale{fill:#f1f8f0}.paleO{fill:#fff0e6}.paleB{fill:#edf6fc}.muted{fill:#506b60}.line{stroke:#163d2e;stroke-width:3}.soft{stroke:#bcd8be;stroke-width:2}.dash{stroke:#bcd8be;stroke-width:2;stroke-dasharray:7 7}.brand{font:700 38px Arial,sans-serif}.title{font:700 36px Georgia,serif;fill:#13392c}.over{font:700 14px Arial,sans-serif;letter-spacing:1.5px;fill:#218447}.section{font:700 31px Arial,sans-serif;fill:#13392c}.body{font:600 17px Arial,sans-serif;fill:#506b60}.small{font:600 14px Arial,sans-serif;fill:#506b60}.tiny{font:600 12px Arial,sans-serif;fill:#506b60}.formula{font:700 19px Arial,sans-serif;fill:#13392c}.pill{font:700 13px Arial,sans-serif;fill:#218447}.step{font:700 14px Arial,sans-serif;fill:#13392c}.stepbody{font:600 11px Arial,sans-serif;fill:#506b60}.stepNo{font:700 15px Arial,sans-serif;fill:#218447}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <!-- header -->
  <text x="44" y="72" class="brand green">KRUSHI</text><text x="224" y="72" class="brand orange">SETU</text>
  <line x1="443" y1="22" x2="443" y2="102" class="line"/>
  <text x="800" y="72" text-anchor="middle" class="title">TECHNICAL APPROACH</text>
  <line x1="1250" y1="22" x2="1250" y2="102" class="line"/>
  <circle cx="1317" cy="61" r="30" fill="#e8f3e6" stroke="#218447" stroke-width="3"/><text x="1317" y="69" text-anchor="middle" style="font:700 25px Arial;fill:#e67d2e">SIH</text><text x="1363" y="54" style="font:700 18px Arial;fill:#13392c">SMART INDIA</text><text x="1363" y="77" style="font:700 18px Arial;fill:#13392c">HACKATHON 2026</text>
  <line x1="30" y1="120" x2="1570" y2="120" class="line"/>
  <text x="800" y="158" text-anchor="middle" class="over">OUR TECHNICAL CHAIN: FIELD SIGNAL → NET-SALE DECISION → TRACEABLE EXECUTION</text>

  <!-- three architecture zones -->
  <line x1="530" y1="185" x2="530" y2="486" class="line"/><line x1="1070" y1="185" x2="1070" y2="486" class="line"/>
  <!-- capture -->
  <text x="285" y="216" text-anchor="middle" class="over">01 • CAPTURE</text><text x="285" y="253" text-anchor="middle" class="section">What is available?</text>
  <text x="285" y="283" text-anchor="middle" class="small">The system starts with real sale inputs, not guesses.</text>
  <rect x="92" y="318" width="386" height="108" rx="12" class="pale" stroke="#bcd8be" stroke-width="2"/>
  <circle cx="133" cy="357" r="23" fill="#dff0c9"/><text x="133" y="365" text-anchor="middle" style="font:700 20px Arial;fill:#13392c">1</text>
  <text x="174" y="352" style="font:700 18px Arial;fill:#13392c">Crop lot</text><text x="174" y="376" class="small">Grade • quantity • village • harvest readiness</text>
  <circle cx="133" cy="399" r="23" fill="#dff0c9"/><text x="133" y="407" text-anchor="middle" style="font:700 20px Arial;fill:#13392c">2</text>
  <text x="174" y="395" style="font:700 18px Arial;fill:#13392c">Market options</text><text x="174" y="419" class="small">APMC rates • buyer offers • freight • storage</text>
  <rect x="133" y="449" width="304" height="28" rx="14" fill="#dff0c9"/><text x="285" y="469" text-anchor="middle" class="pill">React PWA captures data in 3 languages</text>
  <!-- arrow capture to decide -->
  <path d="M480 349 H562" fill="none" stroke="#e67d2e" stroke-width="8" stroke-linecap="round"/><path d="M548 334 L575 349 L548 364" fill="none" stroke="#e67d2e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- decide -->
  <text x="800" y="216" text-anchor="middle" class="over">02 • DECIDE</text><text x="800" y="253" text-anchor="middle" class="section">Which sale is worth it?</text>
  <text x="800" y="283" text-anchor="middle" class="small">This is the KrushiSetu decision engine.</text>
  <rect x="587" y="313" width="426" height="157" rx="17" fill="#12382b"/>
  <text x="800" y="349" text-anchor="middle" style="font:700 14px Arial;letter-spacing:1px;fill:#d9f55a">NET-RETURN ENGINE</text>
  <text x="800" y="385" text-anchor="middle" style="font:700 21px Arial;fill:#fff">Buyer offer − every sale cost</text>
  <line x1="655" y1="405" x2="945" y2="405" stroke="#d9f55a" stroke-width="2" opacity=".5"/>
  <text x="800" y="434" text-anchor="middle" style="font:700 25px Arial;fill:#d9f55a">= FINAL FARMER PAYOUT</text>
  <text x="800" y="456" text-anchor="middle" style="font:600 12px Arial;fill:#fff">Transport • handling • mandi charges • storage cost • payment terms</text>
  <text x="800" y="494" text-anchor="middle" class="pill">Ranks: sell now • store • pooled pickup</text>
  <!-- arrow decide to complete -->
  <path d="M1018 349 H1100" fill="none" stroke="#e67d2e" stroke-width="8" stroke-linecap="round"/><path d="M1086 334 L1113 349 L1086 364" fill="none" stroke="#e67d2e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- complete -->
  <text x="1335" y="216" text-anchor="middle" class="over">03 • COMPLETE</text><text x="1335" y="253" text-anchor="middle" class="section">Can the sale be trusted?</text>
  <text x="1335" y="283" text-anchor="middle" class="small">The decision becomes a visible transaction.</text>
  <path d="M1335 315 L1472 364 L1448 451 Q1410 493 1335 524 Q1260 493 1222 451 L1198 364 Z" fill="#edf6fc" stroke="#218447" stroke-width="3"/>
  <circle cx="1274" cy="371" r="16" class="green"/><text x="1274" y="377" text-anchor="middle" style="font:700 14px Arial;fill:#d9f55a">✓</text><text x="1302" y="377" style="font:700 16px Arial;fill:#13392c">Verified buyer</text>
  <circle cx="1274" cy="410" r="16" class="green"/><text x="1274" y="416" text-anchor="middle" style="font:700 14px Arial;fill:#d9f55a">✓</text><text x="1302" y="416" style="font:700 16px Arial;fill:#13392c">Pickup and quality status</text>
  <circle cx="1274" cy="449" r="16" class="green"/><text x="1274" y="455" text-anchor="middle" style="font:700 14px Arial;fill:#d9f55a">✓</text><text x="1302" y="455" style="font:700 16px Arial;fill:#13392c">Payment milestones</text>
  <rect x="1183" y="544" width="304" height="28" rx="14" fill="#dff0c9"/><text x="1335" y="564" text-anchor="middle" class="pill">Express + MongoDB keep the deal traceable</text>
  <!-- end statement -->
  <rect x="366" y="588" width="868" height="45" rx="9" fill="#f1f8f0" stroke="#bcd8be" stroke-width="2"/>
  <text x="800" y="617" text-anchor="middle" style="font:700 19px Arial;fill:#13392c">KrushiSetu turns scattered market information into one defensible sale decision.</text>
  <!-- lower workflow retained -->
  <line x1="58" y1="662" x2="1542" y2="662" class="line"/><rect x="575" y="643" width="450" height="38" class="bg"/><text x="800" y="670" text-anchor="middle" style="font:700 22px Arial;fill:#13392c">How the Marketplace Works</text>
  <line x1="100" y1="724" x2="1500" y2="724" class="soft"/>
  <g>
    <circle cx="145" cy="724" r="23" class="bg" stroke="#218447" stroke-width="3"/><text x="145" y="730" text-anchor="middle" class="stepNo">1</text><text x="145" y="769" text-anchor="middle" class="step">Create account</text><text x="145" y="788" text-anchor="middle" class="stepbody">OTP and profile</text>
    <circle cx="360" cy="724" r="23" class="bg" stroke="#218447" stroke-width="3"/><text x="360" y="730" text-anchor="middle" class="stepNo">2</text><text x="360" y="769" text-anchor="middle" class="step">List crop</text><text x="360" y="788" text-anchor="middle" class="stepbody">Grade and quantity</text>
    <circle cx="575" cy="724" r="23" class="bg" stroke="#218447" stroke-width="3"/><text x="575" y="730" text-anchor="middle" class="stepNo">3</text><text x="575" y="769" text-anchor="middle" class="step">Compare offers</text><text x="575" y="788" text-anchor="middle" class="stepbody">Net payout view</text>
    <circle cx="790" cy="724" r="23" class="bg" stroke="#218447" stroke-width="3"/><text x="790" y="730" text-anchor="middle" class="stepNo">4</text><text x="790" y="769" text-anchor="middle" class="step">Confirm sale</text><text x="790" y="788" text-anchor="middle" class="stepbody">Buyer and plan</text>
    <circle cx="1005" cy="724" r="23" class="bg" stroke="#218447" stroke-width="3"/><text x="1005" y="730" text-anchor="middle" class="stepNo">5</text><text x="1005" y="769" text-anchor="middle" class="step">Pickup</text><text x="1005" y="788" text-anchor="middle" class="stepbody">Pooled or direct</text>
    <circle cx="1220" cy="724" r="23" class="bg" stroke="#218447" stroke-width="3"/><text x="1220" y="730" text-anchor="middle" class="stepNo">6</text><text x="1220" y="769" text-anchor="middle" class="step">Track delivery</text><text x="1220" y="788" text-anchor="middle" class="stepbody">Quality status</text>
    <circle cx="1435" cy="724" r="23" class="bg" stroke="#218447" stroke-width="3"/><text x="1435" y="730" text-anchor="middle" class="stepNo">7</text><text x="1435" y="769" text-anchor="middle" class="step">Rate deal</text><text x="1435" y="788" text-anchor="middle" class="stepbody">Builds trust</text>
  </g>
  <text x="800" y="854" text-anchor="middle" style="font:700 16px Arial;fill:#218447">Capture the reality • Calculate the real payout • Complete the sale with accountability</text>
</svg>
