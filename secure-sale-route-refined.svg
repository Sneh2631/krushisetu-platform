  <text x="170" y="131" text-anchor="middle" style="font:700 13px Arial,sans-serif;fill:#b64b24">₹ NET VISIBLE BEFORE DISPATCH</text>
  <line x1="82" y1="202" x2="438" y2="202" stroke="#9fbd81" stroke-width="5"/>
  <circle cx="82" cy="202" r="20" fill="#123d2e"/><text x="82" y="209" text-anchor="middle" style="font:700 17px Arial,sans-serif;fill:#d9f55a">1</text>
  <circle cx="201" cy="202" r="20" fill="#123d2e"/><text x="201" y="209" text-anchor="middle" style="font:700 17px Arial,sans-serif;fill:#d9f55a">2</text>
  <circle cx="320" cy="202" r="20" fill="#123d2e"/><text x="320" y="209" text-anchor="middle" style="font:700 17px Arial,sans-serif;fill:#d9f55a">3</text>
  <circle cx="438" cy="202" r="20" fill="#123d2e"/><text x="438" y="209" text-anchor="middle" style="font:700 17px Arial,sans-serif;fill:#d9f55a">4</text>
  <text x="82" y="249" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#13392c">Crop lot</text><text x="82" y="269" text-anchor="middle" style="font:600 12px Arial,sans-serif;fill:#5c7165">Grade + quantity</text>
  <text x="201" y="249" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#13392c">Best buyer</text><text x="201" y="269" text-anchor="middle" style="font:600 12px Arial,sans-serif;fill:#5c7165">Net payout checked</text>
