<svg xmlns="http://www.w3.org/2000/svg" width="520" height="620" viewBox="0 0 520 620" role="img" aria-labelledby="title desc">
  <title id="title">Refined KrushiSetu secure sale route graphic</title>
  <desc id="desc">A compact flow from crop lot to bank credit, with final net payout visible before dispatch and transaction milestones.</desc>
  <rect width="520" height="620" fill="#f7f8f1"/>
  <rect x="18" y="18" width="484" height="584" rx="17" fill="#fff" stroke="#dbe4d6" stroke-width="2"/>
