  <text x="438" y="249" text-anchor="middle" style="font:700 14px Arial,sans-serif;fill:#13392c">Bank credit</text><text x="438" y="269" text-anchor="middle" style="font:600 12px Arial,sans-serif;fill:#5c7165">Payment tracked</text>
  <rect x="45" y="318" width="430" height="58" rx="9" fill="#dff0c9"/>
  <text x="260" y="353" text-anchor="middle" style="font:700 16px Arial,sans-serif;fill:#13392c">Verified buyer  •  Quality confirmed  •  Payment tracked</text>
