<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four additional visual options for the KrushiSetu blank panel</title>
  <desc id="desc">Four compact visual concepts showing net payout ranking, a safe selling decision, a trust triangle and a crop-to-cash route.</desc>
  <defs><style>
    .bg{fill:#f4f7ec}.card{fill:#fff;stroke:#cadac5;stroke-width:3}.title{font:700 30px Arial,sans-serif;fill:#17372b}.tag{font:700 18px Arial,sans-serif;fill:#53785a;letter-spacing:1px}.small{font:600 20px Arial,sans-serif;fill:#52685e}.tiny{font:600 17px Arial,sans-serif;fill:#52685e}.heavy{font:700 33px Arial,sans-serif;fill:#17372b}.green{fill:#17372b}.lime{fill:#d9f55a}.orange{fill:#e3703f}.paleOrange{fill:#f9d8c8}.paleGreen{fill:#dff0c9}.muted{fill:#dce8d7}.light{fill:#f6f9ef}.line{stroke:#9dbc82;stroke-width:5}.thin{stroke:#aabfa1;stroke-width:3}.white{fill:#fff}
  </style></defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="800" y="58" text-anchor="middle" class="title">More visual options for the KrushiSetu blank panel</text>
  <text x="800" y="90" text-anchor="middle" class="small">All are compact enough for the remaining space in your slide</text>

  <!-- Option 5 -->
  <text x="215" y="145" text-anchor="middle" class="tag">OPTION 5 • NET PAYOUT RANKING</text>
  <rect x="40" y="165" width="350" height="570" rx="24" class="card"/>
  <text x="215" y="210" text-anchor="middle" class="heavy">DON'T CHOOSE</text><text x="215" y="244" text-anchor="middle" class="heavy">THE HIGHEST QUOTE</text>
  <text x="215" y="278" text-anchor="middle" class="tiny">CHOOSE THE BEST ₹ NET</text>
  <rect x="78" y="344" width="64" height="116" rx="8" class="paleOrange"/><text x="110" y="384" text-anchor="middle" style="font:700 17px Arial;fill:#a84623">APMC</text><text x="110" y="415" text-anchor="middle" class="tiny">₹ Price</text><text x="110" y="440" text-anchor="middle" style="font:700 16px Arial;fill:#a84623">− costs</text>
  <rect x="154" y="311" width="64" height="149" rx="8" class="muted"/><text x="186" y="350" text-anchor="middle" style="font:700 17px Arial;fill:#17372b">Buyer</text><text x="186" y="381" text-anchor="middle" class="tiny">₹ Price</text><text x="186" y="406" text-anchor="middle" style="font:700 16px Arial;fill:#527a56">− costs</text>
  <rect x="230" y="276" width="82" height="184" rx="8" class="green"/><text x="271" y="318" text-anchor="middle" style="font:700 17px Arial;fill:#d9f55a">BEST</text><text x="271" y="353" text-anchor="middle" style="font:700 22px Arial;fill:#fff">₹ NET</text><text x="271" y="380" text-anchor="middle" style="font:700 13px Arial;fill:#d9f55a">RANK #1</text><text x="271" y="411" text-anchor="middle" style="font:600 12px Arial;fill:#fff">buyer + cost</text><text x="271" y="428" text-anchor="middle" style="font:600 12px Arial;fill:#fff">comparison</text>
  <text x="215" y="527" text-anchor="middle" class="tiny">KrushiSetu ranks every option by</text><text x="215" y="554" text-anchor="middle" style="font:700 22px Arial;fill:#17372b">WHAT REACHES THE FARMER</text>
  <rect x="67" y="641" width="296" height="48" rx="9" class="green"/><text x="215" y="671" text-anchor="middle" style="font:700 15px Arial;fill:#d9f55a">THE BEST SALE IS NOT ALWAYS THE BIGGEST OFFER</text>

  <!-- Option 6 -->
  <text x="605" y="145" text-anchor="middle" class="tag">OPTION 6 • BEFORE THE TRUCK LEAVES</text>
  <rect x="430" y="165" width="350" height="570" rx="24" class="card"/>
  <text x="605" y="210" text-anchor="middle" class="heavy">ONE MOMENT</text><text x="605" y="242" text-anchor="middle" class="tiny">BEFORE THE CROP LEAVES THE FARM</text>
  <circle cx="605" cy="346" r="52" class="paleGreen"/><text x="605" y="356" text-anchor="middle" style="font:700 38px Arial;fill:#17372b">?</text>
  <path d="M605 398 C535 432 515 486 500 563" fill="none" stroke="#e3703f" stroke-width="8"/><path d="M605 398 C676 432 696 486 711 563" fill="none" stroke="#527a56" stroke-width="8"/>
  <text x="495" y="469" text-anchor="middle" style="font:700 17px Arial;fill:#a84623">SELL BLIND</text><text x="495" y="493" text-anchor="middle" class="tiny">Price only</text><text x="495" y="516" text-anchor="middle" class="tiny">Payout unknown</text>
  <text x="715" y="469" text-anchor="middle" style="font:700 17px Arial;fill:#356342">SELL SMART</text><text x="715" y="493" text-anchor="middle" class="tiny">₹ NET visible</text><text x="715" y="516" text-anchor="middle" class="tiny">Buyer verified</text>
  <circle cx="495" cy="583" r="29" class="paleOrange"/><text x="495" y="592" text-anchor="middle" style="font:700 20px Arial;fill:#a84623">?</text>
  <circle cx="715" cy="583" r="29" class="green"/><text x="715" y="592" text-anchor="middle" style="font:700 20px Arial;fill:#d9f55a">✓</text>
  <rect x="459" y="642" width="292" height="48" rx="9" class="green"/><text x="605" y="672" text-anchor="middle" style="font:700 15px Arial;fill:#d9f55a">KRUSHISETU GIVES THE FARMER A BETTER YES</text>

  <!-- Option 7 -->
  <text x="995" y="145" text-anchor="middle" class="tag">OPTION 7 • CONFIDENCE TRIANGLE</text>
  <rect x="820" y="165" width="350" height="570" rx="24" class="card"/>
  <text x="995" y="210" text-anchor="middle" class="heavy">A SALE IS SAFE</text><text x="995" y="242" text-anchor="middle" class="tiny">ONLY WHEN THREE THINGS MATCH</text>
  <path d="M995 286 L858 548 L1132 548 Z" fill="#eef5e8" stroke="#527a56" stroke-width="4"/>
  <circle cx="995" cy="286" r="45" class="green"/><text x="995" y="278" text-anchor="middle" style="font:700 12px Arial;fill:#d9f55a">FINAL</text><text x="995" y="304" text-anchor="middle" style="font:700 20px Arial;fill:#fff">₹ NET</text>
  <circle cx="858" cy="548" r="45" class="green"/><text x="858" y="540" text-anchor="middle" style="font:700 12px Arial;fill:#d9f55a">PICKUP</text><text x="858" y="566" text-anchor="middle" style="font:700 18px Arial;fill:#fff">PLAN</text>
  <circle cx="1132" cy="548" r="45" class="green"/><text x="1132" y="540" text-anchor="middle" style="font:700 12px Arial;fill:#d9f55a">PAYMENT</text><text x="1132" y="566" text-anchor="middle" style="font:700 18px Arial;fill:#fff">TRUST</text>
  <circle cx="995" cy="459" r="54" fill="#d9f55a" stroke="#17372b" stroke-width="4"/><text x="995" y="451" text-anchor="middle" style="font:700 13px Arial;fill:#17372b">FARMER</text><text x="995" y="475" text-anchor="middle" style="font:700 16px Arial;fill:#17372b">SAYS YES</text>
  <text x="995" y="643" text-anchor="middle" class="tiny">Net payout + logistics + payment assurance</text><text x="995" y="670" text-anchor="middle" class="heavy">ONE CONFIDENT SALE</text>

  <!-- Option 8 -->
  <text x="1385" y="145" text-anchor="middle" class="tag">OPTION 8 • CROP-TO-CASH MAP</text>
  <rect x="1210" y="165" width="350" height="570" rx="24" class="card"/>
  <text x="1385" y="210" text-anchor="middle" class="heavy">CROP → CASH</text><text x="1385" y="240" text-anchor="middle" class="tiny">NOT CROP → UNKNOWN</text>
  <path d="M1260 355 H1510" class="line" fill="none"/><path d="M1287 355 L1337 355" stroke="#e3703f" stroke-width="8"/><path d="M1365 355 L1415 355" stroke="#e3703f" stroke-width="8"/>
  <circle cx="1260" cy="355" r="38" class="paleGreen"/><text x="1260" y="365" text-anchor="middle" style="font:700 28px Arial;fill:#17372b">🌾</text>
  <circle cx="1345" cy="355" r="38" class="green"/><text x="1345" y="364" text-anchor="middle" style="font:700 18px Arial;fill:#d9f55a">₹ NET</text>
  <circle cx="1430" cy="355" r="38" class="green"/><text x="1430" y="365" text-anchor="middle" style="font:700 22px Arial;fill:#d9f55a">✓</text>
  <circle cx="1510" cy="355" r="38" class="green"/><text x="1510" y="365" text-anchor="middle" style="font:700 23px Arial;fill:#d9f55a">₹</text>
  <text x="1260" y="420" text-anchor="middle" class="tiny">Crop lot</text><text x="1345" y="420" text-anchor="middle" class="tiny">Best payout</text><text x="1430" y="420" text-anchor="middle" class="tiny">Verified deal</text><text x="1510" y="420" text-anchor="middle" class="tiny">Bank credit</text>
  <rect x="1252" y="486" width="266" height="80" rx="12" class="light"/><text x="1385" y="519" text-anchor="middle" style="font:700 18px Arial;fill:#17372b">THE MISSING LINK</text><text x="1385" y="548" text-anchor="middle" class="tiny">Market information that ends in a completed sale</text>
  <rect x="1245" y="642" width="280" height="48" rx="9" class="green"/><text x="1385" y="672" text-anchor="middle" style="font:700 15px Arial;fill:#d9f55a">FROM MARKET SIGNAL TO MONEY RECEIVED</text>
  <text x="800" y="842" text-anchor="middle" class="small">Recommended: Option 5 for innovation, Option 6 for emotion, Option 7 for trust, Option 8 for a clean workflow story.</text>
</svg>
